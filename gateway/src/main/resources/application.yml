server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Token bucket per authenticated user (per client address before login), state in Redis so every
            # gateway replica shares the same budget. If Redis is down the limiter fails open (see README).
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@principalKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
                redis-rate-limiter.requestedTokens: 1
          routes:
            - id: auth
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<rest>.*), /auth/$\{rest}
            - id: wallet
              uri: ${WALLET_URL:http://localhost:8082}
              predicates:
                - Path=/api/wallet/**
              filters:
                - RewritePath=/api/wallet/(?<rest>.*), /wallet/$\{rest}
            - id: notifications
              uri: ${NOTIFICATIONS_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**
              filters:
                - RewritePath=/api/notifications(?<rest>.*), /notifications$\{rest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wallet:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789}

server:
  port: ${PORT:8082}

spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        linger.ms: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

wallet:
  fraud-url: ${FRAUD_URL:http://localhost:8083}
  fraud-timeout: ${FRAUD_TIMEOUT:2s}
  topup-max-minor: ${TOPUP_MAX_MINOR:1000000}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval: ${OUTBOX_POLL_INTERVAL:200ms}

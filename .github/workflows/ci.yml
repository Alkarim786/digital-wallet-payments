name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend unit + Testcontainers integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      # -Pit also runs the @Tag("integration") suites: real PostgreSQL, Kafka and Redis in Testcontainers.
      - run: mvn -B verify -Pit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"

  frontend:
    name: Dashboard tests + build
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  stack:
    name: Docker images + full-stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - run: docker compose up -d
      - run: python3 scripts/smoke.py http://localhost:8080
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=80
      - run: docker compose down -v
        if: always()
